name: LanguageLearning
options:
  bundleIdPrefix: com.alex
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "V5Q5RY5X9H"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  swift-fsrs:
    url: https://github.com/open-spaced-repetition/swift-fsrs
    # Pin the exact revision currently validated by CueFlow. Tracking `main`
    # made scheduling behaviour change without a local code or release change.
    revision: a4ebe3a1d167fea63b75770cddf781bb78a9f768

targets:
  LanguageLearning:
    type: application
    platform: iOS
    sources:
      - path: LanguageLearning
        excludes:
          - "**/* [0-9].*"      # Finder duplicates like "Info.generated 2.plist"
          - "**/.DS_Store"
    dependencies:
      - package: swift-fsrs
        product: FSRS
      - target: CueFlowWidgets
        embed: true
    info:
      path: LanguageLearning/Info.generated.plist
      properties:
        CFBundleDisplayName: CueFlow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "48"
        CFBundleURLTypes:
          - CFBundleURLName: com.alex.cueflow
            CFBundleURLSchemes:
              - cueflow
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Sprich deine Antwort, um die Aussprache zu üben.
        NSSpeechRecognitionUsageDescription: Spracherkennung läuft auf dem Gerät und hilft, deine gesprochene Antwort zu prüfen.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.cueflow
        CODE_SIGN_ENTITLEMENTS: LanguageLearning/LanguageLearning.entitlements
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - LanguageLearningTests
        - LanguageLearningUITests
      gatherCoverageData: true

  LanguageLearningTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LanguageLearningTests
    dependencies:
      - target: LanguageLearning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.cueflow.tests
        # Host the tests in the app so `@testable import LanguageLearning`
        # can reach the app's internal domain types.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LanguageLearning.app/LanguageLearning"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LanguageLearningUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LanguageLearningUITests
    dependencies:
      - target: LanguageLearning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.cueflow.uitests
        TEST_TARGET_NAME: LanguageLearning

  CueFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CueFlowWidgets
      - path: LanguageLearning/Shared/WidgetSnapshot.swift
    info:
      path: CueFlowWidgets/Info.generated.plist
      properties:
        CFBundleDisplayName: CueFlow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "48"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.cueflow.widgets
        CODE_SIGN_ENTITLEMENTS: CueFlowWidgets/CueFlowWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
