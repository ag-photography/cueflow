name: LanguageLearning
options:
  bundleIdPrefix: com.alex
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "V5Q5RY5X9H"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  swift-fsrs:
    url: https://github.com/open-spaced-repetition/swift-fsrs
    branch: main

targets:
  LanguageLearning:
    type: application
    platform: iOS
    sources:
      - path: LanguageLearning
        excludes:
          - "**/* [0-9].*"      # Finder duplicates like "Info.generated 2.plist"
          - "**/.DS_Store"
    dependencies:
      - package: swift-fsrs
        product: FSRS
    info:
      path: LanguageLearning/Info.generated.plist
      properties:
        CFBundleDisplayName: CueFlow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "23"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: Sprich deine Antwort, um die Aussprache zu üben.
        NSSpeechRecognitionUsageDescription: Spracherkennung läuft auf dem Gerät und hilft, deine gesprochene Antwort zu prüfen.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.cueflow
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
